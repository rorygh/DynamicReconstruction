name: Build and push RunPod image

# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  - Docker Hub username
#   DOCKERHUB_TOKEN     - Docker Hub access token (not your password;
#                          create one at hub.docker.com/settings/security)

# Manual trigger only (Actions tab -> Build and push RunPod image -> Run
# workflow, or `gh workflow run docker-publish.yml`) -- not on every push,
# so iterating on Dockerfile.runpod doesn't kick off a build each commit.
on:
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: rorygh/dynamicreconstruction:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
